<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lopal - Senai</h1>
    <script>
        // console.log("Olá,você")
        // alert("Olá,você")

        let num_one = Number(prompt ("digite o primeiro número:"))
        let num_two = Number(prompt ("digite o segundo número:"))

        console.log (typeof num_one);
        console.log (typeof num_two);

        let sum = num_one + num_two

        alert(`soma: ${sum}`)
        console.log("soma",sum)
        
        let multiplication = num_one * num_two
        
        alert(`multiplicação: ${multiplication}`)
        console.log("multiplicação",multiplication)

        let division = num_one / num_two
        
        alert(`divisão: ${division}`)
        console.log("divisão",division)
        
        let subtraction = num_one - num_two

        alert(`subitração: ${subtraction}`)
        console.log("subitração",subtraction)

    </script>
</body>
</html>
